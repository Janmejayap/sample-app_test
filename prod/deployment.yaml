apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
  namespace: prod
  labels:
    app: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
      - name: hello-app
        image: europe-west4-docker.pkg.dev/qwiklabs-gcp-02-4a8799960d87/my-repository/hello-app:v1.0
        ports:
        - containerPort: 8080
