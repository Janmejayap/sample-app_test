steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'europe-west4-docker.pkg.dev/qwiklabs-gcp-02-4a8799960d87/my-repository/hello-app:v1.0', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'europe-west4-docker.pkg.dev/qwiklabs-gcp-02-4a8799960d87/my-repository/hello-app:v1.0']
- name: 'gcr.io/cloud-builders/kubectl'
  args: ['apply', '-f', 'prod/deployment.yaml', '--namespace=prod']
  env:
  - 'CLOUDSDK_COMPUTE_ZONE=europe-west4-a'
  - 'CLOUDSDK_CONTAINER_CLUSTER=hello-cluster'
